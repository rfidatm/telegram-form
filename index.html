<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotform Telegram Connector</title>
    <script src="https://telegram.org"></script>
</head>
<body style="background-color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">

    <h3>جاري تحضير الاستمارة بأمان...</h3>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            
            // روابط الإعدادات الخاصة بك
            const jotformURL = "https://form.jotform.com/262636640680056"; // ضع رابط الفورم الحقيقي هنا
            const uniqueFieldName = "beneficiary_telegram_id"; // اسم الحقل الفريد في Jotform

            let userId = "No_ID";

            if (tg) {
                tg.ready();
                tg.expand();

                // سحب المعرف
                if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    userId = tg.initDataUnsafe.user.id;
                } else if (tg.initData) {
                    try {
                        const searchParams = new URLSearchParams(tg.initData);
                        const userRaw = searchParams.get('user');
                        if (userRaw) {
                            const userObj = JSON.parse(userRaw);
                            if (userObj && userObj.id) userId = userObj.id;
                        }
                    } catch (e) {}
                }
            }

            // الرابط النهائي المحقون بالـ ID
            const finalRedirectURL = `${jotformURL}?${uniqueFieldName}=${userId}`;

            // الحل السحري للهواتف: إجبار تليجرام على فتح الرابط في متصفح الهاتف الخارجي الآمن
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(finalRedirectURL); // يفتح في Chrome أو Safari فوراً لتجنب حظر جوجل
                setTimeout(() => { tg.close(); }, 1000); // يغلق نافذة تليجرام المصغرة بعد ثانية
            } else {
                // حل احتياطي إذا فتح من الكمبيوتر أو بيئة أخرى
                window.location.href = finalRedirectURL;
            }
        });
    </script>
</body>
</html>
