<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotform Bridge</title>
    <!-- استدعاء مكتبة تليجرام -->
    <script src="https://telegram.org"></script>
</head>
<body style="background-color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 40px;">

    <h3>جاري فتح الاستمارة...</h3>

    <script>
        (function() {
            // الإعدادات الخاصة بك - يرجى وضع الرابط بدقة
            const jotformURL = "https://form.jotform.com/262636640680056"; 
            const uniqueFieldName = "beneficiary_telegram_id"; 

            let userId = "No_ID";

            try {
                // محاولة سحب معرف تليجرام فوراً
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        userId = tg.initDataUnsafe.user.id;
                    }
                }
            } catch (e) {
                console.log("Telegram template pull bypass");
            }

            // الانتقال الفوري والمباشر بدون أي تأخير وبدون تعليق صفحة
            window.location.href = jotformURL + "?" + uniqueFieldName + "=" + userId;
        })();
    </script>
</body>
</html>
