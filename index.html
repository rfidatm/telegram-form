<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <!-- تضمين مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org"></script>
</head>
<body>
    <h3 style="text-align: center; margin-top: 50px; font-family: sans-serif;">جاري تحميل الاستمارة...</h3>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            
            // روابط الاستمارة الخاصة بك (تأكد من تعديلها)
            const jotformURL = "https://app.jotform.com/262637384004557"; 
            const uniqueFieldName = "beneficiary_telegram_id"; 

            let userId = "No_ID";

            if (tg) {
                tg.ready();
                tg.expand(); // فتح الشاشة بالكامل داخل تليجرام
                // محاولة جلب الـ ID من تليجرام
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userId = tg.initDataUnsafe.user.id;
                }
            }

            // توجيه المستخدم فوراً إلى Jotform مع تمرير الـ ID
            window.location.href = `${jotformURL}?${uniqueFieldName}=${userId}`;
        });
    </script>
</body>
</html>
