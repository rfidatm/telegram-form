<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotform Telegram Bridge</title>
    <!-- استدعاء المكتبة الرسمية -->
    <script src="https://telegram.org"></script>
</head>
<body style="background-color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding-top: 60px;">

    <h3 id="status">جاري تأمين الاتصال بالاستمارة...</h3>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // إعداد الروابط (تأكد من تعديلها لبياناتك)
            const jotformURL = "https://jotform.com"; 
            const uniqueFieldName = "telegramId"; 

            let userId = "No_ID";

            // 1. محاولة التقاط الـ ID داخل بيئة تليجرام أولاً قبل أي تحويل
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();

                    // قراءة البيانات المباشرة
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                        userId = tg.initDataUnsafe.user.id;
                    } 
                    // محاولة بديلة إذا كانت البيانات مشفرة بسجلات تليجرام
                    else if (tg.initData) {
                        const searchParams = new URLSearchParams(tg.initData);
                        const userRaw = searchParams.get('user');
                        if (userRaw) {
                            const userObj = JSON.parse(userRaw);
                            if (userObj && userObj.id) userId = userObj.id;
                        }
                    }
                }
            } catch (e) {
                console.error("Error capturing ID:", e);
            }

            // 2. دمج الـ ID المقطوع داخل رابط التوجيه النهائي لضمان عدم ضياعه
            const finalRedirectURL = `${jotformURL}?${uniqueFieldName}=${userId}`;

            // 3. التوجيه الخارجي الآمن للهواتف لتفادي حظر جوجل وسحب الـ ID معاً
            try {
                if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === 'function') {
                    document.getElementById('status').innerText = "جاري فتح الاستمارة في المتصفح الآمن...";
                    window.Telegram.WebApp.openLink(finalRedirectURL);
                    
                    // إغلاق نافذة التليجرام المصغرة بعد نجاح فتح المتصفح الخارجي
                    setTimeout(() => { window.Telegram.WebApp.close(); }, 800);
                } else {
                    // تحويل احتياطي للكمبيوتر والمتصفحات العادية
                    window.location.href = finalRedirectURL;
                }
            } catch (err) {
                window.location.href = finalRedirectURL;
            }
        });
    </script>
</body>
</html>
